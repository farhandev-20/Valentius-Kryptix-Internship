<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2b192" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Tech Grid Accent Lines -->
  <path d="M 50 100 L 350 100 M 50 200 L 350 200 M 50 300 L 350 300 M 100 50 L 100 350 M 200 50 L 200 350 M 300 50 L 300 350" stroke="#4338ca" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Ambient Glow Behind Avatar -->
  <circle cx="200" cy="190" r="120" fill="url(#glowGrad)" opacity="0.25" filter="blur(30px)" />
  <circle cx="200" cy="190" r="115" stroke="url(#glowGrad)" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="8 6" />

  <!-- Floating Code Icons / Symbols -->
  <g opacity="0.75">
    <rect x="40" y="70" width="46" height="28" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="63" y="89" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>

    <rect x="315" y="80" width="46" height="28" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="338" y="99" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">{ AI }</text>

    <rect x="45" y="270" width="44" height="28" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="67" y="289" fill="#f472b6" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">Py</text>

    <rect x="310" y="260" width="48" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="334" y="279" fill="#34d399" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">SQL</text>
  </g>

  <!-- Developer Illustration -->
  <!-- Body / Hoodie -->
  <path d="M 120 380 C 120 300 150 280 200 280 C 250 280 280 300 280 380 Z" fill="url(#shirtGrad)" filter="url(#dropShadow)" />
  <path d="M 175 285 L 200 320 L 225 285 Z" fill="#1e1b4b" opacity="0.4" />
  
  <!-- Neck -->
  <rect x="186" y="235" width="28" height="35" rx="6" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="42" ry="52" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M 158 175 C 158 135 180 120 200 120 C 225 120 242 135 242 175 C 235 155 220 150 200 150 C 175 150 165 160 158 175 Z" fill="#1e293b" />

  <!-- Modern Tech Glasses -->
  <rect x="168" y="178" width="28" height="18" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="2" fill-opacity="0.3" />
  <rect x="204" y="178" width="28" height="18" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="2" fill-opacity="0.3" />
  <line x1="196" y1="187" x2="204" y2="187" stroke="#06b6d4" stroke-width="2" />
  
  <!-- Smiling Mouth -->
  <path d="M 190 220 Q 200 228 210 220" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Laptop Base Front -->
  <path d="M 130 350 L 270 350 L 290 395 L 110 395 Z" fill="url(#laptopGrad)" stroke="#475569" stroke-width="1.5" />
  <rect x="180" y="365" width="40" height="4" rx="2" fill="#6366f1" opacity="0.9" />
</svg>
