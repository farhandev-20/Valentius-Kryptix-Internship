<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFinance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#bgFinance)" />

  <!-- Subtle Chart Grid Lines -->
  <g stroke="#1e293b" stroke-opacity="0.6" stroke-width="1">
    <line x1="40" y1="80" x2="560" y2="80" />
    <line x1="40" y1="140" x2="560" y2="140" />
    <line x1="40" y1="200" x2="560" y2="200" />
    <line x1="40" y1="260" x2="560" y2="260" />
  </g>

  <!-- Dashboard App Window -->
  <rect x="40" y="30" width="520" height="280" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />

  <!-- Window Bar -->
  <path d="M 40 42 C 40 35.37 45.37 30 52 30 L 548 30 C 554.63 30 560 35.37 560 42 L 560 65 L 40 65 Z" fill="#0b1120" />
  <circle cx="62" cy="48" r="5" fill="#ef4444" />
  <circle cx="78" cy="48" r="5" fill="#f59e0b" />
  <circle cx="94" cy="48" r="5" fill="#10b981" />
  <text x="120" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Mutual Fund Performance & Risk Analytics Dashboard</text>

  <!-- Top Metric Cards -->
  <rect x="60" y="80" width="115" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="72" y="98" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">Total Funds Analyzed</text>
  <text x="72" y="122" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">1,450+</text>

  <rect x="190" y="80" width="115" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="202" y="98" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">Avg. 5Y CAGR</text>
  <text x="202" y="122" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="bold">+18.4%</text>

  <rect x="320" y="80" width="115" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="332" y="98" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">Sharpe Ratio</text>
  <text x="332" y="122" fill="#a78bfa" font-family="sans-serif" font-size="18" font-weight="bold">1.85</text>

  <rect x="450" y="80" width="90" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="462" y="98" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">Risk Score</text>
  <text x="462" y="122" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="bold">Low-Med</text>

  <!-- Interactive Trend Chart Area -->
  <g transform="translate(60, 150)">
    <rect width="300" height="135" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">NAV Growth & Benchmark Comparison (NIFTY 50)</text>

    <!-- Area Fill -->
    <path d="M 20 110 Q 60 95 100 80 T 170 50 T 240 30 T 280 20 L 280 120 L 20 120 Z" fill="url(#chartAreaGrad)" />
    <!-- Line -->
    <path d="M 20 110 Q 60 95 100 80 T 170 50 T 240 30 T 280 20" fill="none" stroke="url(#chartLineGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Benchmark Dotted Line -->
    <path d="M 20 115 Q 60 105 100 95 T 170 80 T 240 65 T 280 55" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Pulse Point on Active NAV -->
    <circle cx="280" cy="20" r="5" fill="#10b981" />
    <circle cx="280" cy="20" r="9" fill="#10b981" opacity="0.3" />
  </g>

  <!-- Right Side Asset Allocation Donut Chart -->
  <g transform="translate(380, 150)">
    <rect width="160" height="135" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Asset Allocation</text>
    
    <!-- Donut Simulation -->
    <circle cx="50" cy="75" r="32" fill="none" stroke="#1e293b" stroke-width="16" />
    <circle cx="50" cy="75" r="32" fill="none" stroke="#10b981" stroke-width="16" stroke-dasharray="140 200" stroke-dashoffset="0" />
    <circle cx="50" cy="75" r="32" fill="none" stroke="#3b82f6" stroke-width="16" stroke-dasharray="45 200" stroke-dashoffset="-140" />
    <circle cx="50" cy="75" r="32" fill="none" stroke="#f59e0b" stroke-width="16" stroke-dasharray="25 200" stroke-dashoffset="-185" />

    <!-- Legend -->
    <circle cx="100" cy="55" r="4" fill="#10b981" />
    <text x="110" y="58" fill="#94a3b8" font-family="sans-serif" font-size="9">Equity 68%</text>

    <circle cx="100" cy="75" r="4" fill="#3b82f6" />
    <text x="110" y="78" fill="#94a3b8" font-family="sans-serif" font-size="9">Debt 22%</text>

    <circle cx="100" cy="95" r="4" fill="#f59e0b" />
    <text x="110" y="98" fill="#94a3b8" font-family="sans-serif" font-size="9">Cash 10%</text>
  </g>
</svg>
